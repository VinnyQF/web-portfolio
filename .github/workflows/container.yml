name: Container checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate and start container
        run: |
          docker compose --profile tools config --quiet
          sh -n scripts/refresh-site.sh
          docker compose up -d --build --wait portfolio
          docker compose exec -T portfolio nginx -t
      - name: Check static routes and cache policy
        shell: bash
        run: |
          set -euo pipefail
          for route in / /about/ /pt-br/ /pt-br/sobre/ /healthz; do
            curl --fail --silent --show-error "http://127.0.0.1:4321${route}" > /dev/null
          done
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:4321/not-a-page)" = 404
          for route in /about /pt-br /pt-br/sobre; do
            curl --fail --silent --show-error -D /tmp/redirect-headers "http://127.0.0.1:4321${route}" -o /dev/null
            tr -d '\r' < /tmp/redirect-headers | grep -qi "^Location: ${route}/$"
            curl --fail --silent --show-error --location "http://127.0.0.1:4321${route}" > /dev/null
          done
          curl --fail --silent --show-error -D /tmp/headers http://127.0.0.1:4321/ -o /tmp/page
          grep -qi '^Cache-Control: no-cache' /tmp/headers
          asset=$(grep -oE '/_astro/[^" ]+\.css' /tmp/page | head -n 1)
          test -n "$asset"
          curl --fail --silent --show-error -D /tmp/asset-headers "http://127.0.0.1:4321${asset}" -o /dev/null
          grep -qi 'immutable' /tmp/asset-headers
      - name: Container logs
        if: failure()
        run: docker compose logs portfolio
      - name: Clean up
        if: always()
        run: docker compose down
