name: Update repository data

on:
  schedule:
    # Daily at 03:17 UTC. 
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-repository-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Fetch repository languages and stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run update:repositories
      - name: Validate the updated site
        run: npm test
      - name: Create or update the snapshot pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/repository-data
          add-paths: src/data/repositories.json
          delete-branch: true
          commit-message: 'chore: refresh repository data'
          title: 'chore: refresh repository data'
          body: |
            Refresh GitHub language statistics, star counts, and the snapshot timestamp.