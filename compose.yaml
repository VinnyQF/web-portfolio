services:
  portfolio:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "${PORTFOLIO_BIND:-127.0.0.1}:${PORTFOLIO_PORT:-4321}:8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  repositories:
    profiles: [tools]
    build:
      context: .
      dockerfile: dockerfile
      target: tooling
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    volumes:
      - ./src/data:/app/src/data
    command: [node, scripts/update-repositories.mjs]
